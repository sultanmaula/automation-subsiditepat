services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: app-automation-subsiditepatlpg
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./scripts:/var/www/html/scripts
    networks:
      - app
    depends_on:
      - postgres
      - redis

  scheduler:
    build: .
    container_name: laravel-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: >
      sh -c "while true; do
        php artisan schedule:run;
        sleep 60;
      done"
    networks:
      - app
    depends_on:
      - app
      - redis
      - postgres

  nginx:
    image: nginx:alpine
    container_name: app-nginx-automation-subsiditepatlpg
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app
    depends_on:
      - app

  postgres:
    image: pgvector/pgvector:pg15
    container_name: app-postgres-automation-subsiditepatlpg
    restart: unless-stopped
    environment:
      POSTGRES_DB: automation_subsiditepatlpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5533:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app

  redis:
    image: redis:alpine
    container_name: app-redis-automation-subsiditepatlpg
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - app

volumes:
  pgdata:


networks:
  app:
    driver: bridge
